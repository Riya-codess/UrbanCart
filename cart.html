<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanCart - Cart</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">UrbanCart</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart <span id="cart-count">0</span></a>
    </nav>
</header>


<main class="container">

    <h1>Shopping Cart</h1>

    <table class="cart-table">

        <thead>
            <tr>
                <th>Product</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Subtotal</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="cart-items">
        </tbody>

        <tfoot>
            <tr class="total-row">
                <td colspan="4">
                    <strong>Grand Total</strong>
                </td>

                <td>
                    <strong id="grand-total">₹0</strong>
                </td>
            </tr>
        </tfoot>

    </table>


    <div class="checkout-button">
        <a href="checkout.html" class="btn">
            Proceed to Checkout
        </a>
    </div>

</main>


<footer>
    <p>Contact: support@urbancart.com | Phone: +91 9876543210</p>
    <p>&copy; 2026 UrbanCart. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
