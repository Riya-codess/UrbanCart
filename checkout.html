<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanCart - Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">UrbanCart</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
    </nav>
</header>


<main class="container">

    <h1>Checkout</h1>

    <form class="checkout-form">

        <label for="name">Name</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
        >


        <label for="address">Address</label>
        <input
            type="text"
            id="address"
            name="address"
            placeholder="Enter your address"
            required
        >


        <label for="city">City</label>
        <input
            type="text"
            id="city"
            name="city"
            placeholder="Enter your city"
            required
        >


        <label for="pincode">Pincode</label>
        <input
            type="text"
            id="pincode"
            name="pincode"
            placeholder="Enter your pincode"
            required
        >


        <label for="phone">Phone</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
            required
        >


        <label>Payment Method</label>

        <div class="payment-options">

            <label>
                <input
                    type="radio"
                    name="payment"
                    value="cod"
                    required
                >
                Cash on Delivery
            </label>

            <label>
                <input
                    type="radio"
                    name="payment"
                    value="upi"
                >
                UPI
            </label>

            <label>
                <input
                    type="radio"
                    name="payment"
                    value="card"
                >
                Credit/Debit Card
            </label>

        </div>


        <button type="submit">Place Order</button>

    </form>

</main>


<footer>
    <p>Contact: support@urbancart.com | Phone: +91 9876543210</p>
    <p>&copy; 2026 UrbanCart. All Rights Reserved.</p>
</footer>

</body>
</html>
