<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanCart - Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">UrbanCart</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart <span id="cart-count">0</span></a>
    </nav>
</header>


<main class="container">

    <h1>Checkout</h1>

    <form class="checkout-form" id="checkout-form" novalidate>

        <label for="name">Name</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
        >
        <small id="name-error"></small>


        <label for="address">Address</label>
        <input
            type="text"
            id="address"
            name="address"
            placeholder="Enter your address"
        >
        <small id="address-error"></small>


        <label for="city">City</label>
        <input
            type="text"
            id="city"
            name="city"
            placeholder="Enter your city"
        >


        <label for="pincode">Pincode</label>
        <input
            type="text"
            id="pincode"
            name="pincode"
            placeholder="Enter your pincode"
        >
        <small id="pincode-error"></small>


        <label for="phone">Phone</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
        >
        <small id="phone-error"></small>


        <label>Payment Method</label>

        <div class="payment-options">

            <label>
                <input
                    type="radio"
                    name="payment"
                    value="cod"
                >
                Cash on Delivery
            </label>

            <label>
                <input
                    type="radio"
                    name="payment"
                    value="upi"
                >
                UPI
            </label>

            <label>
                <input
                    type="radio"
                    name="payment"
                    value="card"
                >
                Credit/Debit Card
            </label>

        </div>


        <button type="submit">Place Order</button>

        <div id="confirmation" class="success-popup">
    <span class="success-icon">✓</span>
    <div>
        <strong>Order Placed Successfully!</strong>
        <p>Thank you for shopping with UrbanCart.</p>
    </div>
</div>

    </form>

</main>


<footer>
    <p>Contact: support@urbancart.com | Phone: +91 9876543210</p>
    <p>&copy; 2026 UrbanCart. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
